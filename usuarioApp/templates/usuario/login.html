{% extends 'base.html' %}
{% load static %}

{% block titulo %}Iniciar sesión - Maison D'Equilibre{% endblock %}

{% block contenido %}
<section class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card card-spa p-4">
        <h3 class="mb-1 text-center">Iniciar sesión</h3>
        <p class="text-center text-muted small mb-4">
        </p>

        <form method="get" action="{% url 'login' %}">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario o correo</label>
            <input type="text" class="form-control" id="usuario" name="usuario"
                   placeholder="nombre.apellido@sparelax.cl">
          </div>
          <div class="mb-3">
            <label for="clave" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="clave" name="clave"
                   placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-spa-primary w-100">Ingresar</button>
        </form>

        <div class="d-flex align-items-center my-4">
          <hr class="flex-grow-1">
          <span class="px-3 text-muted small">o entra directo a</span>
          <hr class="flex-grow-1">
        </div>

        <div class="d-grid gap-2">
          <a href="{% url 'rendimiento_terapeuta' %}" class="btn btn-spa-secondary">
            Acceso directo · Terapeuta
          </a>
          <a href="{% url 'panel_admin' %}" class="btn btn-spa-secondary">
            Acceso directo · Administrador
          </a>
        </div>

        <p class="text-center small text-muted mt-4 mb-0">
          <a href="{% url 'main' %}">Volver al inicio</a>
        </p>
      </div>

    </div>
  </div>
</section>
{% endblock %}
