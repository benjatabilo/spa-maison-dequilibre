<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Maison D'Equilibre{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-spa">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'main' %}">
        <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8 6 6 10 6 13a6 6 0 0 0 12 0c0-3-2-7-6-11z" fill="#8A9B7A" />
          <line x1="12" y1="22" x2="12" y2="13" stroke="#EFE7D8" stroke-width="1.2" />
        </svg>
        Maison D'Equilibre
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSpa"
        aria-controls="navbarSpa" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSpa">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'main' %}">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'terapias' %}">Terapias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Terapeutas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Promociones</a>
          </li>
        </ul>
        <a href="{% url 'login' %}" class="btn btn-spa-secondary btn-sm ms-lg-3">Iniciar sesión</a>
      </div>
    </div>
  </nav>

  {% block contenido %}{% endblock %}

  <footer class="footer-spa">
    <p class="mb-0">Maison D'Equilibre &copy; 2026 - La Serena</p>
  </footer>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/custom.js' %}"></script>
</body>

</html>
