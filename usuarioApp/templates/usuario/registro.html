{% extends 'base.html' %}

{% block titulo %}Registro - Maison D'Equilibre{% endblock %}

{% block contenido %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-spa p-4 shadow-sm">
                <h2 class="mb-4 text-center">Registro de Cliente</h2>
                
                <form method="post">
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-spa-primary">Crear Cuenta</button>
                    </div>
                </form>
                
                <p class="mt-3 text-center">
                    ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
